name = "word30210/is_forty_two"
version = "0.1.0"
description = "an pesde package to check if a number is equal to 42."
authors = ["word30210 <wordisnottoto@gmail.com>"]
repository = "https://github.com/Word30210/is-forty-two"
license = "MIT"
includes = [
    "README.md",
    "LICENSE",
    "pesde.toml",
    "src/**",
]

[target]
environment = "luau"
lib = "src/lib.luau"

[dev_dependencies]
darklua = { name = "pesde/darklua", version = "^0.18.0", target = "lune" }
multitarget = { name = "ewdev/multitarget", version = "^0.4.2-rc.7", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.7.0-rc.1", target = "lune" }

[indices]
default = "https://github.com/pesde-pkg/index"
